[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "learning-llm-training"
version = "0.1.0"
description = "Small, readable implementations for learning LLM training."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
tokenization = [
    "tokenizers==0.22.2",
    "datasets>=3",
    "python-dotenv>=1",
    "tomli>=2; python_version < '3.11'",
]

[tool.setuptools.packages.find]
where = ["src"]
