[data]
dataset_id = "HuggingFaceFW/fineweb-2"
subset = "rus_Cyrl"
train_split = "train"
val_split = "test"
# Upper limit: preparation stops earlier when the token budget is full.
train_documents = 20000000
val_documents = 100
seed = 42
shuffle_buffer_size = 0
# revision = "<dataset commit SHA>"

[tokenizer]
path = "artifacts/tokenization/fineweb2-rus-bpe-8k-02/tokenizer.json"
eos_token = "<|endoftext|>"

[model]
attention_backend = "mlx_fused_window"  # Requires our local MLX patch.
attention_types = ["sliding_window", "sliding_window", "sliding_window", "full"]
sliding_window = 256
stable_softmax = false
# Vocabulary size comes from the actual tokenizer.
context_length = 4096
n_layers = 4
n_heads = 4  # Head size 64: supported by the fused Metal kernel.
d_model = 256

[training]
compile_step = true
sampling = "sequential"
steps = 15625  # One pass: 15,625 * 8 * 4,096 = 512M targets.
batch_size = 8
learning_rate = 0.0003
weight_decay = 0.1
grad_clip = 1.0
eval_every = 250
eval_batches = 10
seed = 42
device = "gpu"  # Metal GPU, then CPU; or specify "cpu" / "gpu".

[checkpoint]
every = 1000
keep = 1

[generation]
enabled = true
every = 500
prompts = ["я", "в", "что", "Москва - "]
max_new_tokens = 100
temperature = 0.8
seed = 42

[cache]
directory = "artifacts/data/fineweb2-rus-512m-tokens"

[output]
directory = "artifacts/pretraining/gpt-mlx-swa-fused-4k-512m-01"
