[data]
dataset_id = "HuggingFaceFW/fineweb-2"
subset = "rus_Cyrl"
train_split = "train"
val_split = "test"
# Upper limit: preparation stops earlier when the token budget is full.
train_documents = 20000000
val_documents = 100
seed = 42
shuffle_buffer_size = 0
# revision = "<dataset commit SHA>"

[tokenizer]
path = "artifacts/tokenization/fineweb2-rus-bpe-8k-02/tokenizer.json"
eos_token = "<|endoftext|>"

[model]
attention_backend = "mlx_fused"
stable_softmax = false
# Vocabulary size comes from the actual tokenizer.
context_length = 256
n_layers = 4
n_heads = 2  # Head size 64: supported by the fused Metal kernel.
d_model = 128

[training]
compile_step = true
sampling = "sequential"
steps = 200000
batch_size = 10
learning_rate = 0.0003
weight_decay = 0.1
grad_clip = 1.0
eval_every = 50
eval_batches = 10
seed = 42
device = "gpu"  # Metal GPU, then CPU; or specify "cpu" / "gpu".

[checkpoint]
every = 1000
keep = 1

[generation]
enabled = true
every = 500
prompts = ["я", "в", "что", "Москва - "]
max_new_tokens = 100
temperature = 0.8
seed = 42

[cache]
directory = "artifacts/data/fineweb2-rus-512m-tokens"

[output]
directory = "artifacts/pretraining/gpt-mlx-full-fused-512m-01"
