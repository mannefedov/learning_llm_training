# GPT-2-scale MoE + MLA, mixed SWA32/full attention, fused MLX training.
[data]
dataset_id = "HuggingFaceFW/fineweb-2"
subset = "rus_Cyrl"
train_split = "train"
val_split = "test"
# Upper limit: preparation stops earlier when the token budget is full.
train_documents = 20000000
val_documents = 100
seed = 42
shuffle_buffer_size = 0
# revision = "<dataset commit SHA>"

[tokenizer]
path = "artifacts/tokenization/fineweb2-rus-bpe-8k-02/tokenizer.json"
eos_token = "<|endoftext|>"

[model]
attention_architecture = "mla"
mla_q_rank = 256
mla_kv_rank = 128
mla_qk_head_dim = 32
mla_rope_head_dim = 32
mla_v_head_dim = 64
# Three local layers followed by one full layer, repeated. Window includes self.
attention_types = ["sliding_window", "sliding_window", "sliding_window", "full", "sliding_window", "sliding_window", "sliding_window", "full", "sliding_window", "sliding_window", "sliding_window", "full"]
sliding_window = 32
position_encoding = "rope"
parametrization = "standard"
num_experts = 4
experts_per_token = 2
expert_hidden_dim = 1024
moe_aux_loss_coef = 0.01
attention_backend = "mlx_fused_window"
stable_softmax = false
# Vocabulary size comes from the actual tokenizer.
context_length = 256
n_layers = 12
n_heads = 12
d_model = 768

[training]
compile_step = true
lr_schedule = "cosine"
lr_decay = true
lr_decay_start_step = 80000  # Stable until 80% of the total token budget.
warmup_steps = 1000
min_learning_rate = 0.00003
lr_decay_steps = 100000
sampling = "sequential"
steps = 100000  # Fresh run: 2.048B targets.
batch_size = 4
gradient_accumulation_steps = 20  # 20,480 tokens per optimizer update.
learning_rate = 0.0003
weight_decay = 0.0
grad_clip = 1.0
eval_every = 500
eval_batches = 10
seed = 42
device = "gpu"

[statistics]
every = 500
probe_batches = 2
activations = true
logits = true
gradient_noise_batches = 4
gradient_noise_every = 2500

[checkpoint]
every = 500
keep = 1

[generation]
enabled = true
every = 1000
prompts = ["Сегодня утром я", "В Москве сегодня", "Чтобы приготовить суп,", "Учёные обнаружили", "— Ты куда"]
max_new_tokens = 100
temperatures = [0.0, 0.3, 0.5, 0.8]
seed = 42

[cache]
directory = "artifacts/data/fineweb2-rus-2b-tokens"

[output]
directory = "artifacts/pretraining/gpt-mlx-moe-mla-gpt2-dims-swa32-flash-2b-01"
